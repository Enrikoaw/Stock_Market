<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Glass Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#neonGlow)" stroke-width="8" opacity="0.65" filter="url(#glow)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>

  <!-- Candlestick 1 (Cyan) -->
  <g filter="url(#glow)">
    <line x1="160" y1="180" x2="160" y2="380" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
    <rect x="136" y="220" width="48" height="110" rx="10" fill="#06b6d4"/>
  </g>

  <!-- Candlestick 2 (Emerald Breakout) -->
  <g filter="url(#glow)">
    <line x1="256" y1="120" x2="256" y2="350" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <rect x="232" y="160" width="48" height="140" rx="10" fill="#10b981"/>
  </g>

  <!-- Candlestick 3 (Purple Impulse) -->
  <g filter="url(#glow)">
    <line x1="352" y1="90" x2="352" y2="300" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
    <rect x="328" y="110" width="48" height="130" rx="10" fill="#a855f7"/>
  </g>

  <!-- Sparkle Star Accent -->
  <path d="M 370 100 Q 385 100 385 85 Q 385 100 400 100 Q 385 100 385 115 Q 385 100 370 100 Z" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M 120 180 Q 130 180 130 170 Q 130 180 140 180 Q 130 180 130 190 Q 130 180 120 180 Z" fill="#34d399" filter="url(#glow)"/>

  <!-- Rising Trend Curve Line -->
  <path d="M 110 390 Q 230 330 390 120" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
</svg>
