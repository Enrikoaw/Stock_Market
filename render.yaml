services:
  - type: web
    name: smartflow-idx-screener
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AUTO_SYNC_INTERVAL
        value: "1800"
      - key: PYTHON_VERSION
        value: "3.11.9"
